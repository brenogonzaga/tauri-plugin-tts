[package]
name = "tauri-plugin-tts"
version = "0.1.11"
authors = ["Affex Team"]
description = "Native text-to-speech plugin for Tauri with multi-language and voice selection"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/brenogonzaga/tauri-plugin-tts"
homepage = "https://github.com/brenogonzaga/tauri-plugin-tts"
documentation = "https://docs.rs/tauri-plugin-tts"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-tts"
keywords = [
    "tauri",
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "cross-platform",
]
categories = ["multimedia::audio", "api-bindings"]

[dependencies]
tauri = { version = "2.10.3" }
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
log = "0.4"
ts-rs = { version = "12.0", optional = true }

[features]
default = []
ts-bindings = ["dep:ts-rs"]

# Desktop TTS support
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tts = "0.26"
uuid = { version = "1.20", features = ["v7"] }

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
